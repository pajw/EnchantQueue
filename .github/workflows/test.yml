name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y lua5.1
      - name: Syntax check
        run: for f in *.lua; do luac5.1 -p "$f"; done
      - name: Queue tests
        run: lua5.1 tests/queue_test.lua
      - name: Smoke test (stubbed WoW API)
        run: lua5.1 tests/smoke_test.lua
